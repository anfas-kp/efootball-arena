server {
    listen 80;
    server_name myapp.com;

    # 1. Root proxy configuration
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # =====================================================================
        # 🚨 CRITICAL FIX FOR SESSION LEAKAGE:
        # Never cache dynamic HTML responses that contain a Set-Cookie header.
        # This prevents User B from being assigned User A's session.
        # =====================================================================
        
        # Completely disable caching for responses attempting to set a cookie
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;

        # Bypass the Nginx cache entirely if the incoming request has a sessionid cookie
        proxy_cache_bypass $cookie_sessionid;
        proxy_no_cache $cookie_sessionid;
        
        # (Optional) If you use Nginx microcaching, ensure it's disabled here
        # proxy_cache off;
    }

    # 2. Static and Media Files (Safe to cache globally)
    location /static/ {
        alias /var/www/efootball/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
        alias /var/www/efootball/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
